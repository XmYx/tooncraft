# cargo-deny configuration: the suite licence allowlist (craft-contrib house-rules-rust).
# `cargo xtask licenses` runs the same check without cargo-deny.
[licenses]
allow = [
  "ISC", "MIT", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0", "OFL-1.1", "Ubuntu-font-1.0", "Bitstream-Vera", "CC0-1.0",
  "CC-BY-4.0", "CC-BY-SA-4.0", "Zlib", "BSL-1.0", "0BSD", "Unlicense", "IJG", "NCSA",
  "CDLA-Permissive-2.0", "LicenseRef-Public-Domain", "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-git = "deny"
allow-git = ["https://github.com/storytold/craft-libs", "https://github.com/storytold/egui.git", "https://github.com/storytold/winit.git"]
