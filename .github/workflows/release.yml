name: Release

on:
  # A nightly dry run on main: every release build except macOS, nothing signed or released
  # (craft-common-actions release.yml `dry-run`). Finds release-only breakage before release day.
  schedule:
    - cron: "16 1 * * *"
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""
      dry-run:
        description: "Build and check only: no macOS, no signing, no draft release"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Regenerates contributors/contributors.json for the release commit; every build bundles it.
  credits:
    # Staging guard: signing secrets and org permissions exist only under storytold. Keeps the job
    # inert until the transfer; remove this line after it.
    if: github.repository_owner == 'storytold'
    permissions:
      contents: read
      pull-requests: read
    uses: storytold/craft-common-actions/.github/workflows/refresh-contributors.yml@main
  release:
    needs: credits
    # Staging guard (see credits): remove after the transfer to storytold. Until then a manual run
    # also works outside storytold. It builds every platform unsigned (the signing secrets live in
    # storytold), and a run with dry-run off leaves a draft release to check and publish by hand.
    # `always()` lets it run when the storytold-only credits job is skipped; the builds then bundle
    # the committed contributors file.
    if: >-
      always() && !cancelled() && needs.credits.result != 'failure' &&
      (github.repository_owner == 'storytold' || github.event_name == 'workflow_dispatch')
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      dry-run: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
      app-name: tooncraft
      app-title: ToonCraft
      # No wasm build yet: the app uses native audio, file dialogs and threads throughout.
      has-web: false
      # Keep identical to ci.yml and freebsd.yml. The shared release workflow sets
      # CRAFT_FONTS_REQUIRED=1 in its packaging steps, so a pin without the reviewed Chinese
      # manifest fails the release instead of silently skipping it.
      craft-fonts-ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
      version: ${{ inputs.version }}
      contributors-artifact: ${{ needs.credits.outputs.artifact-name }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
      LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
